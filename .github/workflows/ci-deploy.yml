name: اختبار وبناء APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================
  # 1. الاختبارات
  # ============================
  test:
    name: اختبارات JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: تثبيت الحزم
        run: npm install

      - name: تشغيل الاختبارات
        run: npm test

  # ============================
  # 2. بناء APK
  # ============================
  build-apk:
    name: بناء APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: تثبيت الحزم
        run: npm install

      - name: بناء الواجهة
        run: npm run build:web

      - name: إضافة منصة أندرويد
        run: npx cap add android

      - name: مزامنة Capacitor
        run: npx cap sync android

      - name: توليد keystore للتوقيع
        run: |
          keytool -genkeypair -v \
            -keystore android/release.keystore \
            -alias claudelimits \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass claudelimits2024 \
            -keypass claudelimits2024 \
            -dname "CN=Claude Limits, OU=App, O=App, L=Cairo, ST=Cairo, C=EG"

      - name: إعداد توقيع الإصدار
        working-directory: android
        run: |
          # أضف signing config إلى app/build.gradle
          cat >> app/build.gradle << 'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file("../release.keystore")
                      storePassword "claudelimits2024"
                      keyAlias "claudelimits"
                      keyPassword "claudelimits2024"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          GRADLE

      - name: منح صلاحيات Gradle
        run: chmod +x android/gradlew

      - name: بناء APK (release)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: نسخ APK للمخرجات
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/claude-limits.apk
          echo "حجم APK:"
          ls -lh artifacts/

      - name: رفع APK كـ artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-limits-apk
          path: artifacts/claude-limits.apk
          retention-days: 30

      - name: رقم البناء
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: vars
        run: echo "sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: إنشاء GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.vars.outputs.sha }}
          name: "إصدار ${{ steps.vars.outputs.sha }}"
          body: |
            ### APK جديد 🎉
            حمّل `claude-limits.apk` وثبّته على أندرويد مباشرة.
            > فعّل «مصادر غير معروفة» في إعدادات أندرويد قبل التثبيت.
          files: artifacts/claude-limits.apk
          draft: false
          prerelease: false
