<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12343b">
  <meta name="description" content="تتبع مشاريعك وأوقات انتهاء الليمت على حسابات Claude">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>متتبع ليمت Claude</title>
</head>
<body>
  <header class="top">
    <h1>ليمت Claude</h1>
    <p id="summary" class="summary" aria-live="polite"></p>
  </header>

  <div id="notice" class="notice" hidden></div>

  <main id="accounts" class="accounts"></main>

  <form id="add-account" class="add-account" autocomplete="off">
    <label for="new-account">إضافة حساب</label>
    <div class="row">
      <input id="new-account" type="text" placeholder="اسم الحساب، مثل: الحساب الأول" maxlength="40">
      <button type="submit" class="btn primary">إضافة</button>
    </div>
  </form>

  <script src="core.js"></script>
  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
